$mainMod = ALT
$terminal = kitty
#$fileManager = dolphin
$fileManager = nautilus
$menu = hyprlauncher --toggle

#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(cba6f7ff) rgba(89b4faff) 45deg  # lavender → blue gradient
    col.inactive_border = rgba(45475aaa)
    resize_on_border = true
    layout = dwindle
}

input {
    sensitivity = -0.9
}

decoration {
    rounding = 12

    active_opacity   = 1.0
    inactive_opacity = 0.95

    shadow {
        enabled  = true
        range    = 20
        render_power = 3
        color    = rgba(1e1e2ecc)
    }

    blur {
        enabled  = true
        size     = 6
        passes   = 3
        vibrancy = 0.2
        new_optimizations = true
    }
}

animations {
    enabled = true
    bezier = ease,    0.25, 0.1, 0.25, 1.0
    bezier = bounce,  0.05, 0.9, 0.1,  1.05
    bezier = smooth,  0.4,  0.0, 0.2,  1.0

    animation = windows,     1, 5,  bounce, popin 80%
    animation = windowsOut,  1, 4,  ease,   popin 80%
    animation = fade,        1, 4,  smooth
    animation = workspaces,  1, 5,  smooth, slide
    animation = border,      1, 8,  ease
}

# Autostart
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
exec-once = /usr/lib/xdg-desktop-portal
exec-once = swaync
exec-once = hyprlauncher --daemon
exec-once = ~/.local/bin/wallpaper-cycle
exec-once = waybar

# Audio controls
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind   = , XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Apps
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, E,      exec, $fileManager
bind = $mainMod, D,      exec, $menu

# Windows
bind = $mainMod,       Q, killactive,
bind = $mainMod,       V, togglefloating,
bind = $mainMod,       F, fullscreen,
bind = $mainMod,       P, pseudo,
bind = $mainMod SHIFT, M, exit,
bind = $mainMod SHIFT, R, exec, hyprctl reload

# Lock screen
bind = SUPER, L, exec, hyprlock

# Focus — arrow keys + vim hjkl
bind = $mainMod, left,  movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d
bind = $mainMod, h,     movefocus, l
bind = $mainMod, l,     movefocus, r
bind = $mainMod, k,     movefocus, u
bind = $mainMod, j,     movefocus, d

# Switch workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move window to workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scratchpad
bind = $mainMod,       S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace,        special:magic

# Move/resize with mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Toggle dark/light mode
bind = $mainMod, F10, exec, ~/.local/bin/toggle-dark-mode

# Notification center
bind = $mainMod, N, exec, swaync-client --toggle-panel

# Skip to next wallpaper
bind = $mainMod, F9, exec, pkill -SIGUSR1 -f wallpaper-cycle
