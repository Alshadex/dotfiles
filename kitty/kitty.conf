# Font
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        10.0

# Transparency — lets Hyprland's blur shine through
background_opacity 0.75

# Padding
window_padding_width 12

# No title bar decorations (Hyprland handles this)
hide_window_decorations yes
